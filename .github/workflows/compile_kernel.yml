name: Compile OpenWrt Kernel for MT7981
on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check initial disk space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          echo "=== Disk Usage by Directory ==="
          sudo du -h --max-depth=1 / 2>/dev/null | sort -hr | head -20

      - name: Free up disk space
        run: |
          echo "Cleaning up disk space..."
          # Remove unnecessary packages
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y
          # Remove large packages that are not needed for kernel compilation
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Clear APT cache
          sudo rm -rf /var/cache/apt/archives/*
          echo "Cleanup completed"

      - name: Check disk space after cleanup
        run: |
          echo "=== Disk Space After Cleanup ==="
          df -h
          AVAILABLE_KB=$(df / | tail -1 | awk '{print $4}')
          AVAILABLE_GB=$(echo "$AVAILABLE_KB" | awk '{
            if ($1 ~ /G$/) {
              gsub(/G$/, "", $1); print $1
            } else if ($1 ~ /M$/) {
              gsub(/M$/, "", $1); print $1/1024
            } else {
              print $1/1024/1024
            }
          }')
          echo "Available space: ${AVAILABLE_KB}"
          echo "Available space in GB: ${AVAILABLE_GB}"
          # Check if we have at least 15GB free
          if (( $(echo "$AVAILABLE_GB < 15" | bc -l) )); then
            echo "ERROR: Insufficient disk space. Need at least 15GB, have ${AVAILABLE_GB}GB"
            exit 1
          fi
          echo "Disk space check passed: ${AVAILABLE_GB}GB available"

      - name: Compile the kernel
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_version: 6.6.73
          kernel_auto: false
          kernel_sign: -mt7981-custom
          kernel_repo: padavanonly/immortalwrt-mt798x-6.6
          kernel_config: kernel/config_path
