name: Build OpenWrt Kernel Only

on:
  workflow_dispatch:  # 手动触发
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., 5.15, 6.1)'
        required: true
        default: '6.1'
      target_device:
        description: 'Target device profile'
        required: true
        default: 'xiaomi_redmi_router_ax6000'
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build-kernel.yml'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container:
      image: openwrtorg/rootfs:sdk-22.03.5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        path: openwrt-kernel-build
    
    - name: Initialize environment
      run: |
        cd openwrt-kernel-build
        # 添加必要的包
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext \
          zlib1g-dev swig unzip time rsync python3 python3-setuptools python3-yaml
        
    - name: Clone OpenWrt source
      run: |
        cd /tmp
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git checkout v22.03.5  # 使用稳定版本
        
    - name: Configure for target device
      run: |
        cd /tmp/openwrt
        # 应用配置文件
        if [ -f /github/workspace/openwrt-kernel-build/config/mt7981.config ]; then
          cp /github/workspace/openwrt-kernel-build/config/mt7981.config .config
        else
          # 默认配置
          make defconfig
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_xiaomi_redmi_router_ax6000=y" >> .config
        fi
        
        # 更新配置
        make defconfig
        
    - name: Download feeds
      run: |
        cd /tmp/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Configure kernel
      run: |
        cd /tmp/openwrt
        # 仅配置内核
        echo "CONFIG_ALL_KMODS=n" >> .config
        echo "CONFIG_ALL=n" >> .config
        
        # 根据输入选择内核版本
        if [ "${{ github.event.inputs.kernel_version }}" = "6.1" ]; then
          echo "CONFIG_KERNEL_TESTING=n" >> .config
        elif [ "${{ github.event.inputs.kernel_version }}" = "5.15" ]; then
          echo "CONFIG_LINUX_5_15=y" >> .config
        fi
        
        make kernel_menuconfig
        
    - name: Build kernel only
      run: |
        cd /tmp/openwrt
        # 只编译内核和必要模块
        make -j$(nproc) target/linux/{clean,prepare} V=s
        make -j$(nproc) target/linux/compile V=s
        
        # 编译内核包
        make -j$(nproc) package/kernel/linux/compile V=s
        
    - name: Extract kernel files
      run: |
        cd /tmp/openwrt
        mkdir -p kernel-output
        
        # 提取vmlinux
        find build_dir -name "vmlinux" -type f | head -1 | xargs -I {} cp {} kernel-output/
        
        # 提取Image（压缩内核）
        find build_dir -name "Image" -type f | head -1 | xargs -I {} cp {} kernel-output/
        
        # 提取dtb文件
        find build_dir -name "*.dtb" -type f -exec cp {} kernel-output/ \;
        
        # 提取内核模块
        mkdir -p kernel-output/modules
        find build_dir -name "*.ko" -type f -exec cp {} kernel-output/modules/ \;
        
        # 创建包索引
        cd kernel-output
        find . -type f | sort > files.txt
        
    - name: Create kernel update package
      run: |
        cd /tmp/openwrt/kernel-output
        # 创建内核更新包
        tar czf kernel-update-$(date +%Y%m%d).tar.gz \
          vmlinux \
          Image \
          *.dtb \
          modules/ \
          files.txt
        
        # 计算md5
        md5sum kernel-update-$(date +%Y%m%d).tar.gz > kernel-update-$(date +%Y%m%d).tar.gz.md5
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build-output
        path: |
          /tmp/openwrt/kernel-output/
          /tmp/openwrt/bin/targets/mediatek/mt7981/packages/kmod-*.ipk
        retention-days: 30
